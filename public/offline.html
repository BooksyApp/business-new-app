<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#FBF7F2" />
    <title>booqi Business — offline</title>
    <!-- Served by the service worker when a page is opened with no network. Self-contained
         (no script: the CSP may not allow inline script; no app bundle: it may not be cached),
         and in all three panel languages because the panel's dictionary is not available here. -->
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #FBF7F2; color: #1D1730;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center; padding: 24px; box-sizing: border-box;
      }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 18px; margin: 20px 0 6px; }
      p { margin: 0 0 4px; font-size: 14px; color: #5d5872; }
      a {
        display: inline-block; margin-top: 20px; padding: 12px 22px; border-radius: 12px;
        background: #6F52ED; color: #fff; text-decoration: none; font-weight: 600; font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="booqi" />
      <h1>İnternet bağlantısı yoxdur</h1>
      <p lang="en">You're offline</p>
      <p lang="ru">Нет подключения к интернету</p>
      <a href="/">Yenidən cəhd et · Try again · Повторить</a>
    </main>
  </body>
</html>
